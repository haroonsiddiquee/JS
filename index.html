<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Playground</title>
    <style>
      :root {
        --bg-base: #0a0a0f;
        --grad-1: #4c1d95; /* deep violet */
        --grad-2: #0891b2; /* teal */
        --grad-3: #db2777; /* magenta */
        --panel: rgba(255, 255, 255, 0.04);
        --panel-border: rgba(255, 255, 255, 0.1);
        --text: #e8e6f0;
        --text-dim: #8b88a3;
        --accent: #7dd3fc;
        --warn: #fbbf24;
        --err: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg-base);
        font-family:
          "SF Mono", "JetBrains Mono", "Fira Code", Consolas, monospace;
        color: var(--text);
        overflow: hidden;
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(
            ellipse 900px 600px at 15% 20%,
            color-mix(in srgb, var(--grad-1) 55%, transparent),
            transparent 60%
          ),
          radial-gradient(
            ellipse 800px 700px at 85% 15%,
            color-mix(in srgb, var(--grad-2) 50%, transparent),
            transparent 60%
          ),
          radial-gradient(
            ellipse 1000px 800px at 50% 100%,
            color-mix(in srgb, var(--grad-3) 40%, transparent),
            transparent 65%
          ),
          var(--bg-base);
        background-size: 200% 200%;
        animation: drift 22s ease-in-out infinite;
      }

      @keyframes drift {
        0% {
          background-position:
            0% 0%,
            100% 0%,
            50% 100%;
        }
        50% {
          background-position:
            20% 30%,
            80% 20%,
            40% 90%;
        }
        100% {
          background-position:
            0% 0%,
            100% 0%,
            50% 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bg {
          animation: none;
        }
      }

      .wrap {
        position: relative;
        z-index: 1;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 32px clamp(16px, 6vw, 80px);
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 22px;
        flex-wrap: wrap;
        gap: 10px;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 3.6vw, 38px);
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(
          120deg,
          #fff 0%,
          var(--accent) 50%,
          var(--grad-3) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h1::before {
        content: "> ";
        color: var(--accent);
        -webkit-text-fill-color: var(--accent);
      }

      .sub {
        color: var(--text-dim);
        font-size: 13px;
        letter-spacing: 0.02em;
      }

      .panel {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        border-bottom: 1px solid var(--panel-border);
        font-size: 12px;
        color: var(--text-dim);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .dots {
        display: flex;
        gap: 6px;
      }
      .dots span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
      }
      .dots span:nth-child(1) {
        background: #f87171;
      }
      .dots span:nth-child(2) {
        background: #fbbf24;
      }
      .dots span:nth-child(3) {
        background: #4ade80;
      }

      #output {
        flex: 1;
        overflow-y: auto;
        padding: 20px 22px;
        font-size: 14.5px;
        line-height: 1.8;
      }

      #output .placeholder {
        color: var(--text-dim);
        font-style: italic;
      }

      .line {
        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .line .tag {
        display: inline-block;
        width: 58px;
        font-size: 10px;
        letter-spacing: 0.06em;
        opacity: 0.7;
      }
      .line.log .tag {
        color: var(--accent);
      }
      .line.warn .tag {
        color: var(--warn);
      }
      .line.error .tag {
        color: var(--err);
      }
      .line.warn {
        color: var(--warn);
      }
      .line.error {
        color: var(--err);
      }

      footer {
        margin-top: 14px;
        color: var(--text-dim);
        font-size: 12px;
        text-align: center;
      }
      .kbd {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 5px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        font-size: 11px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>

    <div class="wrap">
      <header>
        <div>
          <h1>JS Playground</h1>
          <div class="sub">
            edit script.js in VS Code, save, then refresh this page
          </div>
        </div>
      </header>

      <section class="panel">
        <div class="panel-head">
          <span>console output</span>
          <div class="dots"><span></span><span></span><span></span></div>
        </div>
        <div id="output">
          <div class="placeholder">// waiting for script.js to run...</div>
        </div>
      </section>

      <footer>
        refresh with <span class="kbd">F5</span> after saving script.js if
        needed
      </footer>
    </div>

    <script>
      // console capture — runs BEFORE script.js loads so it catches everything
      const outputEl = document.getElementById("output");

      function formatArg(arg) {
        if (typeof arg === "string") return arg;
        try {
          return JSON.stringify(arg, null, 2);
        } catch (e) {
          return String(arg);
        }
      }

      function addLine(type, args) {
        if (outputEl.querySelector(".placeholder")) outputEl.innerHTML = "";
        const div = document.createElement("div");
        div.className = "line " + type;
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent =
          type === "log" ? "LOG" : type === "warn" ? "WARN" : "ERROR";
        div.appendChild(tag);
        div.appendChild(document.createTextNode(args.map(formatArg).join(" ")));
        outputEl.appendChild(div);
        outputEl.scrollTop = outputEl.scrollHeight;
      }

      const nativeLog = console.log.bind(console);
      const nativeWarn = console.warn.bind(console);
      const nativeError = console.error.bind(console);

      console.log = (...args) => {
        addLine("log", args);
        nativeLog(...args);
      };
      console.warn = (...args) => {
        addLine("warn", args);
        nativeWarn(...args);
      };
      console.error = (...args) => {
        addLine("error", args);
        nativeError(...args);
      };

      window.addEventListener("error", (e) => {
        addLine("error", [e.message]);
      });
    </script>

    <!-- your actual code lives in script.js — edit that file in VS Code -->
    <script src="script.js"></script>
  </body>
</html>
